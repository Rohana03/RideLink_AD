spring:
  application:
    name: driver-vehicle-service-test
  datasource:
    url: jdbc:h2:mem:driver_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

ridelink:
  jwt:
    secret: ridelink-shared-secret-key-for-it3130-group-assignment-change-me
    expiration-ms: 3600000
  internal:
    api-key: ridelink-internal-service-key-change-me
