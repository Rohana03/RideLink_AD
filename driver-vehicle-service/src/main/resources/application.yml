server:
  port: 8082

spring:
  application:
    name: driver-vehicle-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://${DB_HOST:localhost}:${DB_PORT:27017}/${DB_NAME:driver_db}}
      auto-index-creation: true

ridelink:
  jwt:
    secret: ${JWT_SECRET:ridelink-shared-secret-key-for-it3130-group-assignment-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  internal:
    api-key: ${INTERNAL_API_KEY:ridelink-internal-service-key-change-me}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
