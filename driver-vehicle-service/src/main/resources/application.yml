server:
  port: 8082

spring:
  application:
    name: driver-vehicle-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://${DB_HOST:localhost}:${DB_PORT:27017}/${DB_NAME:driver_db}}
      auto-index-creation: true

ridelink:
  jwt:
    # No default: must come from the JWT_SECRET env var (or a local, git-ignored application-dev.yml)
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  internal:
    api-key: ${INTERNAL_API_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
