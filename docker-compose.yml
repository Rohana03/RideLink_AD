# RideLink local development environment.
# Brings up one MySQL instance per service (separate databases = separate
# persistence boundaries, per the assignment's data-ownership requirement)
# plus a shared RabbitMQ broker for the asynchronous ride-completion event.
#
# Usage: docker compose up -d
version: "3.8"

services:
  mysql-account:
    image: mysql:8.0
    container_name: ridelink-mysql-account
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: account_db
    ports:
      - "3307:3306"
    volumes:
      - account_db_data:/var/lib/mysql

  mysql-driver:
    image: mysql:8.0
    container_name: ridelink-mysql-driver
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: driver_db
    ports:
      - "3308:3306"
    volumes:
      - driver_db_data:/var/lib/mysql

  mysql-ride:
    image: mysql:8.0
    container_name: ridelink-mysql-ride
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ride_db
    ports:
      - "3309:3306"
    volumes:
      - ride_db_data:/var/lib/mysql

  mysql-fare:
    image: mysql:8.0
    container_name: ridelink-mysql-fare
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fare_payment_db
    ports:
      - "3310:3306"
    volumes:
      - fare_db_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ridelink-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)

volumes:
  account_db_data:
  driver_db_data:
  ride_db_data:
  fare_db_data:
