server:
  port: 8081

spring:
  application:
    name: account-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://${DB_HOST:localhost}:${DB_PORT:27017}/${DB_NAME:account_db}}
      auto-index-creation: true

ridelink:
  jwt:
    # No default: must come from the JWT_SECRET env var (or a local, git-ignored application-dev.yml).
    # Must be identical in every service and at least 32 bytes long.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  internal:
    api-key: ${INTERNAL_API_KEY}
  admin:
    # Optional bootstrap admin, created at start-up only when both values are set.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
