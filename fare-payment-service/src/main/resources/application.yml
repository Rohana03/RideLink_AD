server:
  port: 8084

spring:
  application:
    name: fare-payment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fare_payment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

ridelink:
  jwt:
    secret: ${JWT_SECRET:ridelink-shared-secret-key-for-it3130-group-assignment-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  fare:
    base-fare: 100.0
    per-km-rate: 60.0
    per-min-rate: 10.0
    average-speed-kmh: 30.0
  rabbit:
    ride-events-exchange: ride.events.exchange
    ride-completed-routing-key: ride.completed
    ride-completed-queue: ride.completed.queue

springdoc:
  swagger-ui:
    path: /swagger-ui.html
