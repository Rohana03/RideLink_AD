server:
  port: 8083

spring:
  application:
    name: ride-management-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ride_db}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

ridelink:
  jwt:
    # No default: must come from the JWT_SECRET env var (or a local, git-ignored application-dev.yml).
    # Must be identical in every service and at least 32 bytes long.
    secret: ${JWT_SECRET}
  internal:
    # Sent as X-Internal-Api-Key on calls to Driver & Vehicle and Fare & Payment. No default.
    api-key: ${INTERNAL_API_KEY}
  services:
    driver-vehicle-base-url: ${DRIVER_SERVICE_URL:http://localhost:8082}
    fare-payment-base-url: ${FARE_SERVICE_URL:http://localhost:8084}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  # Driver assignment: nearest AVAILABLE driver within radius-km of the pickup
  matching:
    radius-km: 5.0
    max-candidates: 5
  messaging:
    # false = report completed rides to Fare & Payment over REST; true = publish RideCompletedEvent to RabbitMQ
    enabled: ${MESSAGING_ENABLED:false}
  rabbit:
    ride-events-exchange: ride.events.exchange
    ride-completed-routing-key: ride.completed

springdoc:
  swagger-ui:
    path: /swagger-ui.html
